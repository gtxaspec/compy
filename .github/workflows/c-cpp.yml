name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-no-tls:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Build and test (no TLS)
        run: |
          cd tests
          cmake -B build
          cmake --build build
          ./build/tests

  test-tls-backends:
    strategy:
      fail-fast: false
      matrix:
        backend:
          - { name: OpenSSL, flag: COMPY_TLS_OPENSSL, pkg: libssl-dev }
          - { name: wolfSSL, flag: COMPY_TLS_WOLFSSL, pkg: libwolfssl-dev }
          - { name: mbedTLS, flag: COMPY_TLS_MBEDTLS, pkg: libmbedtls-dev }
    runs-on: ubuntu-latest
    name: test-${{ matrix.backend.name }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libmbedtls-dev ${{ matrix.backend.pkg }}

      - name: Build and test (${{ matrix.backend.name }})
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan_suppressions.txt
        run: |
          cd tests
          cmake -B build -D${{ matrix.backend.flag }}=ON
          cmake --build build
          ./build/tests

  test-tsan:
    strategy:
      fail-fast: false
      matrix:
        backend:
          - { name: OpenSSL, flag: COMPY_TLS_OPENSSL, pkg: libssl-dev }
          - { name: wolfSSL, flag: COMPY_TLS_WOLFSSL, pkg: libwolfssl-dev }
          - { name: mbedTLS, flag: COMPY_TLS_MBEDTLS, pkg: libmbedtls-dev }
    runs-on: ubuntu-latest
    name: tsan-${{ matrix.backend.name }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libmbedtls-dev ${{ matrix.backend.pkg }}

      - name: Build and test with TSAN (${{ matrix.backend.name }})
        run: |
          cd tests
          cmake -B build -D${{ matrix.backend.flag }}=ON -DCOMPY_TSAN=ON
          cmake --build build
          ./build/tests

  example-out-of-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libevent-dev python3

      - name: Build the example server with ASan/UBSan
        run: |
          cmake -S examples -B examples/build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build examples/build

      - name: Out-of-order request sequences
        run: |
          cd examples
          python3 tests/out_of_order.py build/server media

  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format-19
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-19

      - name: Check formatting
        run: |
          find include src tests -name '*.c' -o -name '*.h' | \
            grep -v '/priv/compiler_attrs.h' | \
            xargs clang-format-19 --dry-run --Werror
